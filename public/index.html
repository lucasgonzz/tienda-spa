    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <script src="https://live.decidir.com/static/v2.5/decidir.js"></script>
    
    <!--
      Aca NO va ningun link de icono. Los iconos los declara @vue/cli-plugin-pwa en tiempo de
      build, desde el bloque "pwa" de vue.config.js (iconPaths + assetsVersion): ese es el unico
      lugar donde hay que tocarlos.

      Por que no se declaran a mano (y no volver a hacerlo): el plugin inyecta su propio set de
      links de iconos SIEMPRE, sin mirar lo que diga este template. Declararlos aca daba dos tags
      por cada icono, y los del plugin -- que son los que ganan en la mayoria de los navegadores --
      salian sin el "?v=" de cache-busting. Peor todavia: el plugin envuelve el PRIMER link de
      icono de este template en un comentario condicional de Internet Explorer, con lo cual el tag
      mas especifico quedaba invisible para todos los demas navegadores.

      El favicon.ico sigue existiendo en public/ y se sirve en la raiz del sitio: es el que buscan
      por su cuenta los navegadores y crawlers viejos cuando no encuentran un link declarado.
    -->
    <!--
      Etiquetas estaticas que valen igual para cualquier pagina de la tienda: quedan AFUERA de la
      region seo:head para que ni seo.php ni la limpieza de main.js las toquen.
    -->
    <meta property="og:locale" content="es_AR">
    <meta property="og:site_name" content="<%= htmlWebpackPlugin.options.siteName %>">
    <!--
      Sin JavaScript no hay Vue que tape el contenido estatico que inyecta seo.php: el overlay
      blanco (.seo-cargando, ver public/seo.php) se esconde y el visitante ve ese HTML.
    -->
    <noscript><style>.seo-cargando{display:none}</style></noscript>
    <!--
      Region SEO (mision seo-tiendas, 23/9/2026). Lo que esta entre los dos marcadores es el
      "head por defecto" de la tienda:
        - public/seo.php (capa PHP del servidor) REEMPLAZA esta region entera por las etiquetas de
          la pagina pedida (titulo, descripcion, canonica, robots, Open Graph, Twitter y JSON-LD),
          que le arma tienda-api. Si la API falla, el index se sirve tal cual, con esto adentro.
        - src/main.js SACA del head todo lo que tiene data-seo justo antes de montar Vue: a partir
          de ahi el dueño del head es vue-meta, que no toca etiquetas que no creo el y si no se
          sacaran quedarian duplicadas.
      Los marcadores sobreviven a la minificacion porque vue.config.js los excluye con
      minify.ignoreCustomComments. No cambiarles el texto sin cambiar tambien seo.php y esa regex.

      Open Graph / Twitter Card: es lo que leen WhatsApp, Instagram y Facebook para armar la vista
      previa cuando el comercio comparte el link de su tienda. El crawler de Meta NO ejecuta
      JavaScript. Los valores por defecto los inyecta vue.config.js desde las VUE_APP_SITE_* que
      admin-api escribe en el .env del clone antes de compilar, una vez por cliente.
    -->
    <!--seo:head-->
    <title data-seo><%= htmlWebpackPlugin.options.title %></title>
    <meta data-seo name="description" content="<%= htmlWebpackPlugin.options.siteDescription %>">
    <meta data-seo property="og:type" content="website">
    <meta data-seo property="og:title" content="<%= htmlWebpackPlugin.options.siteName %>">
    <meta data-seo property="og:description" content="<%= htmlWebpackPlugin.options.siteDescription %>">
    <meta data-seo property="og:url" content="<%= htmlWebpackPlugin.options.siteUrl %>">
    <meta data-seo property="og:image" content="<%= htmlWebpackPlugin.options.siteImage %>">
    <meta data-seo property="og:image:width" content="1200">
    <meta data-seo property="og:image:height" content="630">
    <meta data-seo name="twitter:card" content="summary_large_image">
    <meta data-seo name="twitter:title" content="<%= htmlWebpackPlugin.options.siteName %>">
    <meta data-seo name="twitter:description" content="<%= htmlWebpackPlugin.options.siteDescription %>">
    <meta data-seo name="twitter:image" content="<%= htmlWebpackPlugin.options.siteImage %>">
    <!--/seo:head-->
    <script src="https://widget.cloudinary.com/v2.0/global/all.js" type="text/javascript"></script>
    <script src="https://product-gallery.cloudinary.com/all.js" type="text/javascript"></script>



    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@3.5.2/animate.min.css">
  </head>
  <body>
    <noscript>
      <strong>Para comprar en <%= htmlWebpackPlugin.options.title %> necesitás tener JavaScript activado.</strong>
    </noscript>
    <!--
      public/seo.php mete aca adentro el HTML estatico de la pagina (cuerpo_html de tienda-api) para
      los buscadores y las vistas previas. Vue REEMPLAZA este div al montar, asi que el visitante
      sigue viendo la SPA de siempre. seo.php lo busca con una regex tolerante a comillas porque
      minificado queda <div id=app></div>.
    -->
    <div id="app"></div>
    <!-- built files will be auto injected -->
    <!--
      Repositorio publico: la API key de Google Maps se saca del codigo fuente. Esto NO la
      vuelve secreta (index.html se sirve tal cual, la key sigue viajando visible al
      navegador); sirve para poder rotarla sin tocar codigo y para que no quede en el repo.
      La proteccion real es restringirla en Google Cloud Console (por API habilitada y por
      dominio/referrer HTTP). Vue CLI interpola VUE_APP_* directamente en este template.
      El guard typeof evita ReferenceError si la variable no esta en el .env del build: sin
      el guard, html-webpack-plugin tira excepcion y el build falla; con el guard, el mapa
      queda sin funcionar pero la tienda sigue andando.
    -->
    <script
      src="https://maps.googleapis.com/maps/api/js?key=<%= typeof VUE_APP_GOOGLE_MAPS_API_KEY !== 'undefined' ? VUE_APP_GOOGLE_MAPS_API_KEY : '' %>&language=es"
      async
    ></script>
  </body>
