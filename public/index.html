    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <script src="https://live.decidir.com/static/v2.5/decidir.js"></script>
    
    <!--
      Iconos PWA: los PNG van primero porque son mas especificos (tamano y formato exactos que
      cada plataforma pide) y los navegadores modernos los priorizan sobre el .ico generico, que
      queda al final como fallback para clientes viejos. El "?v=" de cache-busting usa
      VUE_APP_ICONS_VERSION, que admin-api escribe en el .env del clone cuando regenera los
      iconos de un comercio (ver EcommerceInstallationService.php). El guard typeof evita
      ReferenceError si la variable no esta en el .env del build: sin el guard, html-webpack-plugin
      tira excepcion y el build entero falla (paso justo con el intento anterior de este bloque);
      con el guard, el "?v=" queda vacio pero la tienda sigue compilando y sirviendo los iconos.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="<%= BASE_URL %>img/icons/favicon-32x32.png?v=<%= typeof VUE_APP_ICONS_VERSION !== 'undefined' ? VUE_APP_ICONS_VERSION : '' %>">
    <link rel="icon" type="image/png" sizes="16x16" href="<%= BASE_URL %>img/icons/favicon-16x16.png?v=<%= typeof VUE_APP_ICONS_VERSION !== 'undefined' ? VUE_APP_ICONS_VERSION : '' %>">
    <link rel="apple-touch-icon" sizes="180x180" href="<%= BASE_URL %>img/icons/apple-touch-icon-180x180.png?v=<%= typeof VUE_APP_ICONS_VERSION !== 'undefined' ? VUE_APP_ICONS_VERSION : '' %>">
    <link rel="mask-icon" href="<%= BASE_URL %>img/icons/safari-pinned-tab.svg?v=<%= typeof VUE_APP_ICONS_VERSION !== 'undefined' ? VUE_APP_ICONS_VERSION : '' %>" color="#000000">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico?v=<%= typeof VUE_APP_ICONS_VERSION !== 'undefined' ? VUE_APP_ICONS_VERSION : '' %>">
    <title><%= htmlWebpackPlugin.options.title %></title>
    <!--
      Open Graph / Twitter Card: es lo que leen WhatsApp, Instagram y Facebook para armar la vista
      previa cuando el comercio comparte el link de su tienda. Tiene que estar en el HTML estatico:
      el crawler de Meta NO ejecuta JavaScript, asi que nada que haga Vue en runtime lo afecta.
      Los valores los inyecta vue.config.js desde las VUE_APP_SITE_* que admin-api escribe en el
      .env del clone antes de compilar, una vez por cliente.
    -->
    <meta name="description" content="<%= htmlWebpackPlugin.options.siteDescription %>">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="es_AR">
    <meta property="og:site_name" content="<%= htmlWebpackPlugin.options.siteName %>">
    <meta property="og:title" content="<%= htmlWebpackPlugin.options.siteName %>">
    <meta property="og:description" content="<%= htmlWebpackPlugin.options.siteDescription %>">
    <meta property="og:url" content="<%= htmlWebpackPlugin.options.siteUrl %>">
    <meta property="og:image" content="<%= htmlWebpackPlugin.options.siteImage %>">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="<%= htmlWebpackPlugin.options.siteName %>">
    <meta name="twitter:description" content="<%= htmlWebpackPlugin.options.siteDescription %>">
    <meta name="twitter:image" content="<%= htmlWebpackPlugin.options.siteImage %>">
    <script src="https://widget.cloudinary.com/v2.0/global/all.js" type="text/javascript"></script>
    <script src="https://product-gallery.cloudinary.com/all.js" type="text/javascript"></script>



    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@3.5.2/animate.min.css">
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
    <!--
      Repositorio publico: la API key de Google Maps se saca del codigo fuente. Esto NO la
      vuelve secreta (index.html se sirve tal cual, la key sigue viajando visible al
      navegador); sirve para poder rotarla sin tocar codigo y para que no quede en el repo.
      La proteccion real es restringirla en Google Cloud Console (por API habilitada y por
      dominio/referrer HTTP). Vue CLI interpola VUE_APP_* directamente en este template.
      El guard typeof evita ReferenceError si la variable no esta en el .env del build: sin
      el guard, html-webpack-plugin tira excepcion y el build falla; con el guard, el mapa
      queda sin funcionar pero la tienda sigue andando.
    -->
    <script
      src="https://maps.googleapis.com/maps/api/js?key=<%= typeof VUE_APP_GOOGLE_MAPS_API_KEY !== 'undefined' ? VUE_APP_GOOGLE_MAPS_API_KEY : '' %>&language=es"
      async
    ></script>
  </body>
